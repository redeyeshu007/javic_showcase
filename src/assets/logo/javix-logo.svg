<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-label="JAVIX">
  <title>JAVIX</title>
  <!-- Left chevron - outline -->
  <polyline points="3,4 15,20 3,36" stroke="#1A6B4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <!-- Left chevron - green fill -->
  <polygon points="10,5 24,20 10,35 17,20" fill="#43C47A"/>
  <!-- JAVIX letters using geometric paths for reliability -->
  <!-- J -->
  <rect x="30" y="7" width="4" height="23" rx="1" fill="#0B3B2D"/>
  <path d="M30 30 Q30 36 24 36 Q24 34 25 33 Q28 33 28 30Z" fill="#0B3B2D"/>
  <!-- A -->
  <polygon points="43,7 50,30 46,30 43,22 40,30 36,30" fill="#0B3B2D"/>
  <rect x="38" y="21" width="10" height="3.5" rx="1" fill="#0B3B2D"/>
  <!-- V -->
  <polygon points="54,7 62,7 66,30 63,30 58,13 53,30 50,30" fill="#0B3B2D"/>
  <!-- I -->
  <rect x="70" y="7" width="4" height="23" rx="1" fill="#0B3B2D"/>
  <!-- X - dark base -->
  <line x1="80" y1="7" x2="94" y2="30" stroke="#0B3B2D" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="7" x2="80" y2="30" stroke="#0B3B2D" stroke-width="4" stroke-linecap="round"/>
  <!-- X - green chevron right half -->
  <polygon points="94,7 104,18.5 94,30 99,18.5" fill="#43C47A"/>
</svg>
